spring.application.name=home-nursing

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carenest}
spring.datasource.username=${DB_USER:carenest}
spring.datasource.password=${DB_PASSWORD:carenest}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis
#spring.data.redis.host=${SPRING_REDIS_HOST:redis}
#spring.data.redis.port=${SPRING_REDIS_PORT:6379}
#spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Twilio
TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:}
TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:}
TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER:}

# Cloudinary
CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:}
CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:}
CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:}

# Multipart uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB

# JWT
JWT_SECRET=${JWT_SECRET:secretKeyForJwtSigningAndValidation1234567890AB}
JWT_ACCESS_TOKEN_TTL_MIN=${JWT_ACCESS_TOKEN_TTL_MIN:15}
JWT_REFRESH_TOKEN_TTL_DAYS=${JWT_REFRESH_TOKEN_TTL_DAYS:30}

# Admin API key (for /api/v1/admin/** endpoints)
ADMIN_API_KEY=${ADMIN_API_KEY:admin-secret-change-me}

# OTP
OTP_TTL_SECONDS=${OTP_TTL_SECONDS:300}
OTP_MAX_ATTEMPTS=${OTP_MAX_ATTEMPTS:3}

# Google Sign-In (on-device SDK -> ID token validated via tokeninfo)
# Web OAuth client ID used as serverClientId by the mobile apps and as the expected audience
GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:}
PENDING_TOKEN_TTL_SECONDS=${PENDING_TOKEN_TTL_SECONDS:600}

# Visit code (QR-based completion)
visit.code.ttl-hours=${VISIT_CODE_TTL_HOURS:24}
visit.code.max-attempts=${VISIT_CODE_MAX_ATTEMPTS:5}

# Rate limiting
RATE_LIMIT_PHONE_WINDOW_SECONDS=${RATE_LIMIT_PHONE_WINDOW_SECONDS:600}
RATE_LIMIT_PHONE_MAX_REQUESTS=${RATE_LIMIT_PHONE_MAX_REQUESTS:3}
RATE_LIMIT_IP_WINDOW_SECONDS=${RATE_LIMIT_IP_WINDOW_SECONDS:600}
RATE_LIMIT_IP_MAX_REQUESTS=${RATE_LIMIT_IP_MAX_REQUESTS:10}

# Nearby nurse matching
nearby.nurses.radius-km=${NEARBY_NURSES_RADIUS_KM:10}
nearby.nurses.included-distance-km=${NEARBY_NURSES_INCLUDED_DISTANCE_KM:5}
nearby.nurses.price-per-km=${NEARBY_NURSES_PRICE_PER_KM:12}

# Server
server.port=${PORT:8080}

spring.docker.compose.enabled=false

server.forward-headers-strategy=framework

# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=false

# API keys for the AI assistant (Gemini chat + Google GenAI embeddings + pgvector)

# --- ENABLE Google GenAI Chat (free Gemini Flash) ---
# The same free-tier API key from Google AI Studio is reused for chat and embeddings.
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_EMBEDDING_API_KEY:skip}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}

# --- AI retry: don't hammer Gemini further on quota (429); cap attempts ---
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.max-interval=10s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.exclude-on-http-codes=429

# --- ENABLE Google GenAI Embeddings ---
# Non-blank default keeps the connection bean bootable when the key is not yet set (queries 401 until a real key is provided)
spring.ai.google.genai.embedding.api-key=${GEMINI_EMBEDDING_API_KEY:skip}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
# Required by Spring AI 2.0 (unused in API-key mode, but must be non-blank)
spring.ai.google.genai.embedding.project-id=${GEMINI_PROJECT_ID:carebridge}
spring.ai.google.genai.embedding.location=${GEMINI_LOCATION:us-central1}
# CRITICAL: Force Gemini to output 768 dimensions (pgvector HNSW limit is 2000)
spring.ai.google.genai.embedding.text.dimensions=768

# --- PGVector Configuration ---
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# CRITICAL: Must match the embedding dimensions exactly!
spring.ai.vectorstore.pgvector.dimensions=768

# --- FAQ RAG retrieval tuning ---
faq.search.top-k=6
faq.search.similarity-threshold=0.35

# --- FAQ ingestion ---
faq.ingestion.retry-delay-ms=60000
faq.ingestion.max-attempts=10

# --- Chat rate limiting (per user) ---
chat.rate-limit.window-seconds=300
chat.rate-limit.max-requests=20
