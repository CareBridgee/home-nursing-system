# Test profile — layered on top of application.properties
# Postgres + Redis connection are provided by Testcontainers via @ServiceConnection.

# Admin key for integration tests (matches BaseIntegrationTest helper)
ADMIN_API_KEY=test-admin-key

# Generous rate limits / OTP budgets so tests are never flaky
RATE_LIMIT_PHONE_WINDOW_SECONDS=600
RATE_LIMIT_PHONE_MAX_REQUESTS=100000
RATE_LIMIT_IP_WINDOW_SECONDS=600
RATE_LIMIT_IP_MAX_REQUESTS=100000
OTP_MAX_ATTEMPTS=100
OTP_TTL_SECONDS=600
OTP_RESEND_COOLDOWN_SECONDS=1
chat.rate-limit.window-seconds=600
chat.rate-limit.max-requests=100000

# Visit codes: short TTL is fine for tests (defaults kept otherwise)
visit.code.ttl-hours=24
visit.code.max-attempts=100

# Neutralize self-referencing placeholders from application.properties
# (X=${X:...} with an absent env var is a circular reference — override in the test profile)
JWT_SECRET=test-jwt-secret-for-tests-1234567890
JWT_ACCESS_TOKEN_TTL_MIN=15
JWT_REFRESH_TOKEN_TTL_DAYS=30
TWILIO_ACCOUNT_SID=
TWILIO_AUTH_TOKEN=
TWILIO_FROM_NUMBER=
CLOUDINARY_CLOUD_NAME=
CLOUDINARY_API_KEY=
CLOUDINARY_API_SECRET=
